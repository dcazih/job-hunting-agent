name: Daily Scheduler Poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  trigger-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Call backend cron endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Missing BACKEND_URL secret"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET secret"
            exit 1
          fi

          curl --fail-with-body \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BACKEND_URL%/}/api/cron"
